<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid white;
        }
        h1 {
            font-size: 24px;
            margin: 10px 0;
        }
        .bio {
            font-size: 16px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            border-radius: 25px;
            padding: 15px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: background 0.3s;
        }
        .link-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        footer {
            margin-top: 50px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
 <style>
    body {
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .back-button {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 9999;

      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      color: #202124;
      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);

      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .back-button:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
    }

    .back-button:active {
      transform: translateY(0) scale(0.96);
    }

    .back-button svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.4;
    }

    iframe {
      width: 100%;
      height: 1800px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<button class="back-button" onclick="history.back()" aria-label="Kembali">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
    
    <div class="container">
        <img src="https://raw.githubusercontent.com/brehnatasurya-cmd/wleowleo/b9b4124e044b3403c6c635e9d2262793439ca84b/logoosis1.png" alt="Avatar" class="avatar"> <!-- Ganti dengan URL gambar avatar Anda -->
        <h1>OSIS MPK SMAN 1 GEDEG</h1> <!-- Ganti dengan nama Anda -->
        <p class="bio">All About Us!!</p> <!-- Ganti dengan bio Anda -->
        
        <div class="links">
            <a href="https://www.instagram.com/osismpksmage?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" class="link-btn" onclick="handleClick('Instagram')">Instagram</a> <!-- Ganti href dengan link asli -->
            <a href="https://www.tiktok.com/@ofc.osismpksmage1?is_from_webapp=1&sender_device=pc" class="link-btn" onclick="handleClick('Tiktok')">Tiktok</a>
            <a href="https://youtube.com/@smagetv?si=JShJzlcZpA410lpB" class="link-btn" onclick="handleClick('YouTube')">YouTube</a>
            <a href="https://sman1gedeg.sch.id/" class="link-btn" onclick="handleClick('Website')">Website Resmi</a>
            <!-- Tambahkan lebih banyak link sesuai kebutuhan -->
        </div>
        
        <footer>
            Create from Github.com
        </footer>
    </div>

    <script>
        function handleClick(platform) {
            alert(`Mengarahkan ke ${platform}...`); // Ganti dengan window.location.href = link; untuk redirect langsung
        }
    </script>
</body>
</html>
